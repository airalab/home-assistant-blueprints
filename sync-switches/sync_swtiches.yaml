blueprint:
  name: Sync switches (fixed)
  description: >-
    Keeps a group of switches/lights in the same state, in both directions:
    toggling any one of them propagates to the rest. A group helper cannot do
    this — it only drives top-down, so pressing a physical wall switch is not
    reflected on the others.

    Fixed version of airalab/sync_swtiches.yaml. The original triggered on
    `event_type: state_changed` — that is, ANY state change of ANY entity in the
    whole Home Assistant — and filtered "mine / not mine" in conditions, i.e.
    already inside the run. With `mode: single`, a new trigger was dropped while
    the previous run was still going. On a site with hundreds of entities the
    bus is never idle, so real button presses were regularly discarded with
    "Already running". It looked like "sometimes it just doesn't work" and got
    blamed on radio/connectivity.

    Here the trigger is `state` on the selected entities only (the bus is no
    longer touched) and `mode: queued`. No filter conditions and no templates
    are left.
  domain: automation
  input:
    switches:
      name: Entities to sync
      description: >-
        Switches and/or lights to keep in the same state. At least two.
      selector:
        entity:
          multiple: true
          filter:
            - domain: switch
            - domain: light

# queued, not single: presses arriving while a previous run is in progress are
# queued instead of dropped. This is the actual fix.
mode: queued
max: 10

triggers:
  # not_from filters out the return from unavailable/unknown — otherwise every
  # group would fire at once after a Home Assistant restart or a device
  # reconnect.
  - trigger: state
    entity_id: !input switches
    to: "on"
    not_from:
      - unknown
      - unavailable
    id: turned_on
  - trigger: state
    entity_id: !input switches
    to: "off"
    not_from:
      - unknown
      - unavailable
    id: turned_off

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: turned_on
        sequence:
          # The command targets the whole group, including the entity that
          # triggered it: idempotent, and shorter than subtracting it with
          # reject. No loop — turning on an already-on entity produces no state
          # change, so the chain stops at the second hop.
          - action: homeassistant.turn_on
            target:
              entity_id: !input switches
      - conditions:
          - condition: trigger
            id: turned_off
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input switches
